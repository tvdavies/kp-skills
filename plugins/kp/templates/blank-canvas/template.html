<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Blank Canvas</title>
<link rel="stylesheet" href="../_kp/brand.css">
<script src="../_kp/kp.js"></script>
<style>
  /*
   * Blank Canvas: a plain tone background to build a one-off layout on.
   *
   * Rules for whoever builds on this (see brand/brand-guide.md):
   * - Position things with the kp-abs class and left/top/right/bottom in
   *   design pixels (the canvas is 1080 wide; height follows the size).
   * - Anchor things near the bottom with `bottom:`, so the layout holds in
   *   both 4:5 and square. Use html[data-aspect="square"] rules to adjust.
   * - Use the brand classes (kp-eyebrow, kp-display, kp-headline, kp-body,
   *   kp-name, kp-detail, kp-pill, kp-rule, kp-card, kp-stars) and tone
   *   colours (var(--tone-bg), var(--tone-ink), var(--tone-soft)).
   * - Give each editable piece of text a data-field attribute, and each
   *   photo an img with class kp-photo and a data-field attribute.
   *   Keep text 64px from the edges.
   */
</style>
</head>
<body>
<main class="kp-slide blank-canvas" data-tone="cream">
</main>
</body>
</html>
