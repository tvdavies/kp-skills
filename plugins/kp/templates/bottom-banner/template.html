<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Bottom Banner</title>
<link rel="stylesheet" href="../_kp/brand.css">
<script src="../_kp/kp.js"></script>
<style>
  /* Bottom Banner: photo across the top, a tone banner along the bottom. */
  .bottom-banner { --banner-h: 432px; }
  .bottom-banner .photo { left: 0; top: 0; width: 100%; height: calc(100% - var(--banner-h)); }
  .bottom-banner .banner {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--banner-h);
    padding: 77px var(--kp-margin) 0;
    display: flex; flex-direction: column; gap: 22px;
  }
  .bottom-banner .headline { height: 84px; white-space: nowrap; }
  .bottom-banner .caption { font-size: 32px; line-height: 1.3; opacity: 0.75; max-height: 84px; overflow: hidden; }

  html[data-aspect="square"] .bottom-banner { --banner-h: 346px; }
  html[data-aspect="square"] .bottom-banner .banner { padding-top: 64px; }
  html[data-aspect="three-four"] .bottom-banner { --banner-h: 450px; }
  html[data-aspect="nine-sixteen"] .bottom-banner { --banner-h: 560px; }
  html[data-aspect="nine-sixteen"] .bottom-banner .banner { padding-top: 96px; }
  html[data-aspect="nine-sixteen"] .bottom-banner .headline { height: 100px; }

  /* Landscape: photo on the left, banner becomes a side panel. */
  html[data-aspect="landscape"] .bottom-banner .photo { width: 58%; height: 100%; }
  html[data-aspect="landscape"] .bottom-banner .banner {
    left: 58%; top: 0; height: auto; padding: 0 56px; justify-content: center;
  }
  html[data-aspect="landscape"] .bottom-banner .headline { height: 150px; white-space: normal; }
  html[data-aspect="landscape"] .bottom-banner .caption { font-size: 26px; max-height: 102px; }
</style>
</head>
<body>
<main class="kp-slide bottom-banner" data-tone="sand">
  <div class="kp-abs kp-photo-frame photo">
    <img class="kp-photo" data-field="photo" src="" alt="" style="--focus-x: 50%; --focus-y: 35%; --zoom: 1;">
  </div>
  <div class="banner">
    <h1 class="kp-headline headline" data-field="headline" data-fit="42 76" data-fit-landscape="34 56" data-fit-nine-sixteen="48 88" data-valign="top">New work <em>is live.</em></h1>
    <p class="caption" data-field="caption" data-optional>Full gallery: link in bio</p>
  </div>
</main>
</body>
</html>
